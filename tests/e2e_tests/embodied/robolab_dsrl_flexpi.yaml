# FlexPi (frozen) + DSRL on one RoboLab benchmark task, single uni node.
#
# Two interpreters on one CPython 3.11.16 build: RLinf's node_groups put the
# env worker under the RoboLab venv (IsaacSim) and the actor/rollout workers
# under the FlexPi venv, which carries the latents_action overlay first on
# PYTHONPATH. Ray pickles actor classes by value, so every venv in the cluster
# must share the Python minor. The env worker spawns the simulator in a child
# process.
#
# Sized as a smoke: 4 envs, a handful of decision steps. Scale total_num_envs,
# max_epochs and save_interval for a real run.

defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    env:
      node_group: "sim"
      placement: 1
    rollout:
      node_group: "policy"
      placement: 0
    actor:
      node_group: "policy"
      placement: 0
  node_groups:
    - label: "sim"
      node_ranks: all
      env_configs:
        - node_ranks: all
          python_interpreter_path: /site/anjiangwei/envs/robolab-isaac50/RoboLab/.venv/bin/python
          env_vars:
            # The env worker must NOT inherit the driver's PYTHONPATH: that one
            # carries Tao's py3.10 trees, and this py3.11 interpreter then imports
            # a cp310 numpy ("Error importing numpy ... from your python
            # interpreter from there", job 42593). Only RLinf itself is needed.
            - PYTHONPATH: /data/code/anjiangwei/flexpi-rl/RLinf
            - OMNI_KIT_ACCEPT_EULA: "YES"
            - VK_DRIVER_FILES: /usr/share/vulkan/icd.d/nvidia_icd.json
            - ROBOLAB_VIEWPORT_CAM: "0"
            - LD_LIBRARY_PATH: /site/anjiangwei/envs/robolab-isaac50/syslibs/inject
            - OMNI_CACHE_ROOT: /data/cache/anjiangwei/omni
    - label: "policy"
      node_ranks: all
      env_configs:
        - node_ranks: all
          python_interpreter_path: /site/anjiangwei/envs/flexpi311/.venv/bin/python
          env_vars:
            # latents_action overlay first; then Tao's serving deps (openpi
            # client/server) and the frozen FlexPi source. His speed-ab overlay
            # is cp310 and is replaced by the same pins installed in the venv.
            - PYTHONPATH: /site/anjiangwei/envs/flexpi/overlay:/site/tao/speed-ab-uni-20260911/deps:/site/tao/cap100-v1-drop10-ft4-cfg5-20260911/source/src:/data/code/anjiangwei/flexpi-rl/RLinf
            - FLEXPI_DIR: /site/tao/cap100-v1-drop10-ft4-cfg5-20260911/source
            - DIFFSYNTH_MODEL_BASE_PATH: /site/models/diffsynth
            - DIFFSYNTH_SKIP_DOWNLOAD: "true"
            - HF_HOME: /site/tao/hf_cache
            - HF_HUB_OFFLINE: "1"
            - FLEXPI_JOINT_VIDEO: "0"
            - FLEXPI_JOINT_DINO: "0"
            - FLEXPI_JOINT_POINTMAP: "0"
            - FLEXPI_EXTRA_OVR: "model.text_condition_dropout=0 model.empty_text_context_path=null"

runner:
  task_type: embodied
  logger:
    log_path: /data/code/anjiangwei/rlinf/out/robolab_dsrl_flexpi
    project_name: rlinf
    experiment_name: "robolab-dsrl-flexpi-smoke"
    logger_backends: ["tensorboard"]
  max_epochs: 2
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: -1

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"
  agg_q: mean
  actor_agg_q: mean
  backup_entropy: False
  critic_subsample_size: 0
  critic_actor_ratio: 1
  bootstrap_type: standard
  gamma: 0.99
  tau: 0.005
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 1.0
    target_entropy: -256   # -noise_dim (32 x 8)
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: True
    cache_size: 2000
    sample_window_size: 2000
    min_buffer_size: 1   # buffer counts rollout batches; train right after epoch 1
    auto_save: False
  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 1
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    env_type: robolab
    seed: 0
    rollout_epoch: 1
    total_num_envs: 4
    auto_reset: True
    ignore_terminations: False
    use_rel_reward: False
    use_step_penalty: False
    max_episode_steps: 900
    max_steps_per_rollout_epoch: 96   # 3 chunks of 32 sim steps
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/train
    group_size: 1
    use_fixed_reset_state_ids: False
    enable_offload: False
    init_params:
      id: MustardInLeftBinTask
      task_description: "Put the mustard in the left bin"
      num_envs: null
      success_bonus: 1.0
      instruction_type: default
  eval:
    env_type: robolab
    seed: 1000
    rollout_epoch: 1
    total_num_envs: 4
    auto_reset: True
    ignore_terminations: True
    use_rel_reward: False
    use_step_penalty: False
    max_episode_steps: 900
    max_steps_per_rollout_epoch: 900
    is_eval: True
    group_size: 1
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    use_fixed_reset_state_ids: True
    enable_offload: False
    init_params:
      id: MustardInLeftBinTask
      task_description: "Put the mustard in the left bin"
      num_envs: null
      success_bonus: 1.0
      instruction_type: default

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False
  model:
    model_type: flexpi
    # Generic worker code reads model_path for every model; FlexPi's own
    # loading goes through flexpi.ckpt, so this only has to be a real path.
    model_path: ${actor.model.flexpi.ckpt}
    precision: bf16
    is_lora: False
    load_to_device: False
    num_action_chunks: 32
    use_dsrl: True
    action_dim: 8
    flexpi: ${actor.model.flexpi}
    dsrl_state_dim: 8
    dsrl_image_latent_dim: 64
    dsrl_state_latent_dim: 64
    dsrl_hidden_dims: [128, 128, 128]
    dsrl_num_q_heads: 10

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 4
  seed: 42
  enable_offload: False
  model:
    model_type: flexpi
    model_path: ${actor.model.flexpi.ckpt}
    precision: bf16
    is_lora: False
    load_to_device: False
    num_action_chunks: 32
    use_dsrl: True
    # The frozen 5B model is loaded lazily by the process that denoises (the
    # rollout worker); the actor trains only the DSRL heads on this config.
    action_dim: 8
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    flexpi:
      eval_dir: /site/tao/cap100-v1-drop10-ft4-cfg5-20260911
      ckpt: /site/tao/cap100-v1-drop10-ft4-cfg5-20260911/step-18000/step_018000.pt
      dataset_stats: /site/tao/cap100-v1-drop10-ft4-cfg5-20260911/step-18000/step_018000.pt.stats.json
      task: cap100_v1_continue_textdrop10
      num_inference_steps: 20
      text_cfg_scale: 5.0
      seed: 42
    dsrl_state_dim: 8
    dsrl_image_latent_dim: 64
    dsrl_state_latent_dim: 64
    dsrl_hidden_dims: [128, 128, 128]
    dsrl_num_q_heads: 10
  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5
  critic_optim:
    lr: 3.0e-4
    clip_grad: 10.0
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
