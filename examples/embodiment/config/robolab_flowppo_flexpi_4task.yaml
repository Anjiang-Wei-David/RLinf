# Plan B: flow-matching PPO on FlexPi's ActionDiT (1.0B params) on the four
# RoboLab tasks, one uni node. The rollout makes one denoising step of each
# 32-step action chunk stochastic (OpenPI's flow_sde, noise level 0.5) and
# records the latent chain; the actor recomputes that step's log-prob with the
# current ActionDiT weights (backbone frozen, fp32 master weights, bf16 compute)
# and updates it with GAE-PPO. Same placement, envs and reward as before.

defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    env:
      node_group: "sim"
      placement: 4-7
    rollout:
      node_group: "policy"
      placement: 0-3
    actor:
      node_group: "policy"
      placement: 0-3
  node_groups:
    - label: "sim"
      node_ranks: all
      env_configs:
        - node_ranks: all
          python_interpreter_path: /site/anjiangwei/envs/robolab-isaac50/RoboLab/.venv/bin/python
          env_vars:
            # The env worker must NOT inherit the driver's PYTHONPATH: that one
            # carries Tao's py3.10 trees, and this py3.11 interpreter then imports
            # a cp310 numpy ("Error importing numpy ... from your python
            # interpreter from there", job 42593). Only RLinf itself is needed.
            - PYTHONPATH: /data/code/anjiangwei/flexpi-rl/RLinf
            - OMNI_KIT_ACCEPT_EULA: "YES"
            - VK_DRIVER_FILES: /usr/share/vulkan/icd.d/nvidia_icd.json
            - ROBOLAB_VIEWPORT_CAM: "0"
            - LD_LIBRARY_PATH: /site/anjiangwei/envs/robolab-isaac50/syslibs/inject
            - OMNI_CACHE_ROOT: /data/cache/anjiangwei/omni
    - label: "policy"
      node_ranks: all
      env_configs:
        - node_ranks: all
          python_interpreter_path: /site/anjiangwei/envs/flexpi311/.venv/bin/python
          env_vars:
            # latents_action overlay first; then Tao's serving deps (openpi
            # client/server) and the frozen FlexPi source. His speed-ab overlay
            # is cp310 and is replaced by the same pins installed in the venv.
            - PYTHONPATH: /site/anjiangwei/envs/flexpi/overlay:/site/tao/speed-ab-uni-20260911/deps:/site/tao/cap100-v1-drop10-ft4-cfg5-20260911/source/src:/data/code/anjiangwei/flexpi-rl/RLinf
            - FLEXPI_DIR: /site/tao/cap100-v1-drop10-ft4-cfg5-20260911/source
            - DIFFSYNTH_MODEL_BASE_PATH: /site/models/diffsynth
            - DIFFSYNTH_SKIP_DOWNLOAD: "true"
            - HF_HOME: /site/tao/hf_cache
            - HF_HUB_OFFLINE: "1"
            - FLEXPI_JOINT_VIDEO: "0"
            - FLEXPI_JOINT_DINO: "0"
            - FLEXPI_JOINT_POINTMAP: "0"
            - FLEXPI_EXTRA_OVR: "model.text_condition_dropout=0 model.empty_text_context_path=null"

runner:
  task_type: embodied
  logger:
    log_path: /site/anjiangwei/rlinf-runs/robolab4-flowppo-flexpi
    project_name: rlinf
    experiment_name: "robolab4-flowppo-flexpi"
    logger_backends: ["tensorboard"]
  max_epochs: 400
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: 10
  resume_dir: null

algorithm:
  update_epoch: 3
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_type: chunk_level     # one transition = one 32-step chunk; reward summed
  logprob_type: chunk_level    # as in RLinf's OpenPI flow PPO; lr is small enough
  entropy_type: token_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 1.0
  huber_delta: 10.0
  gamma: 0.99          # per chunk
  gae_lambda: 0.95
  reward_coef: 1.0

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    env_type: robolab
    seed: 0
    rollout_epoch: 1
    total_num_envs: 32   # 8 per task
    auto_reset: True
    ignore_terminations: False
    use_rel_reward: False
    use_step_penalty: False
    # RoboLab's own time limits at 15 control steps/s: BowlStacking 300 steps,
    # Mustard 450, BowlInBin and ReorientRedMug 900; a timed-out env is frozen
    # with truncated=true until the chunk-end reset.
    max_episode_steps: 900
    max_steps_per_rollout_epoch: 192   # 6 chunks of 32 sim steps
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/train
    group_size: 1
    use_fixed_reset_state_ids: False
    enable_offload: False
    init_params:
      id: MustardInLeftBinTask
      task_description: "Put the mustard in the left bin"
      num_envs: null
      success_bonus: 1.0
      instruction_type: default
    # One task per env-worker rank (placement 4-7 -> ranks 0-3). The prompt
    # comes from the task's own instruction table, not from task_description.
    override_cfgs:
      - init_params: {id: BowlInBinTask, task_description: "put the bowl in the grey bin"}
      - init_params: {id: BowlStackingLeftOnRightTask, task_description: "Stack the left bowl on the right bowl"}
      - init_params: {id: MustardInLeftBinTask, task_description: "Put the mustard in the left bin"}
      - init_params: {id: ReorientRedMugTask, task_description: "Put the red mug upright so that the opening is facing upwards."}
  eval:
    env_type: robolab
    seed: 1000
    rollout_epoch: 1
    total_num_envs: 32
    # One episode per env per epoch: a finished env holds until the epoch
    # ends instead of starting another attempt (which would inflate
    # success_once for tasks with a short time limit).
    auto_reset: False
    ignore_terminations: True
    use_rel_reward: False
    use_step_penalty: False
    # 28 chunks of 32; the two 900-step tasks lose their last 4 steps.
    max_episode_steps: 896
    max_steps_per_rollout_epoch: 896
    is_eval: True
    group_size: 1
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    use_fixed_reset_state_ids: True
    enable_offload: False
    init_params:
      id: MustardInLeftBinTask
      task_description: "Put the mustard in the left bin"
      num_envs: null
      success_bonus: 1.0
      instruction_type: default
    override_cfgs: ${env.train.override_cfgs}

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: False
  collect_prev_infos: True     # PPO needs the rollout's log-probs and values
  model:
    model_type: flexpi
    # Generic worker code reads model_path for every model; FlexPi's own
    # loading goes through flexpi.ckpt, so this only has to be a real path.
    model_path: ${actor.model.flexpi.ckpt}
    precision: bf16
    is_lora: False
    load_to_device: False
    num_action_chunks: 32
    action_dim: 8
    noise_scale: 1.0   # latent range = scale * tanh(.)
    train_flexpi: True
    flow_rl:
      noise_level: 0.5
      ignore_last: True
    prompts:
      - "put the bowl in the grey bin"
      - "Stack the left bowl on the right bowl"
      - "Put the mustard in the left bin"
      - "Put the red mug upright so that the opening is facing upwards."
    add_q_head: False
    add_value_head: True
    flexpi: ${actor.model.flexpi}
    dsrl_state_dim: 8
    dsrl_image_latent_dim: 64
    dsrl_state_latent_dim: 64
    dsrl_hidden_dims: [128, 128, 128]

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8      # each sample re-runs FlexPi's prefill (~0.4 s)
  global_batch_size: 192   # the whole rollout epoch (32 envs x 6 chunks)
  seed: 42
  enable_offload: False
  model:
    model_type: flexpi
    model_path: ${actor.model.flexpi.ckpt}
    precision: fp32   # master weights of the trained ActionDiT; the rollout runs bf16
    is_lora: False
    load_to_device: False
    num_action_chunks: 32
    # The frozen 5B model is loaded lazily by the process that denoises (the
    # rollout worker); the actor trains only the noise policy and value head.
    action_dim: 8
    noise_scale: 1.0   # latent range = scale * tanh(.)
    train_flexpi: True
    flow_rl:
      noise_level: 0.5
      ignore_last: True
    prompts:
      - "put the bowl in the grey bin"
      - "Stack the left bowl on the right bowl"
      - "Put the mustard in the left bin"
      - "Put the red mug upright so that the opening is facing upwards."
    add_value_head: True
    add_q_head: False
    flexpi:
      eval_dir: /site/tao/cap100-v1-drop10-ft4-cfg5-20260911
      ckpt: /site/tao/cap100-v1-drop10-ft4-cfg5-20260911/step-18000/step_018000.pt
      dataset_stats: /site/tao/cap100-v1-drop10-ft4-cfg5-20260911/step-18000/step_018000.pt.stats.json
      task: cap100_v1_continue_textdrop10
      num_inference_steps: 20
      text_cfg_scale: 5.0
      seed: 42
    dsrl_state_dim: 8
    dsrl_image_latent_dim: 64
    dsrl_state_latent_dim: 64
    dsrl_hidden_dims: [128, 128, 128]
  optim:
    lr: 5.0e-6           # OpenPI flow-PPO value for the action expert
    value_lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 1.0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      # fp32 master weights in the model, bf16 compute like the rollout's FlexPi
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16

reward:
  use_reward_model: False

critic:
  use_critic_model: False
